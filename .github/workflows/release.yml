name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # 生成本次 tag 的 Release 正文（git-cliff，配置见 cliff.toml）
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag 与三处版本号一致性断言：手动发版打岔时 fail fast，避免产物与
      # Release 标题（取自 tauri.conf.json）跟 tag 版本错位
      - name: Assert tag matches manifest versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$1" != "$TAG" ]; then
              echo "❌ $2 版本 $1 与 tag v$TAG 不一致"
              fail=1
            fi
          }
          check "$(node -p "require('./package.json').version")" "package.json"
          check "$(node -p "require('./src-tauri/tauri.conf.json').version")" "tauri.conf.json"
          check "$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)" "Cargo.toml"
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "✅ tag v$TAG 与三处版本号一致"

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tauri:
    needs: release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (M1+)
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          # Windows - x86_64
          - platform: windows-latest
            args: ""
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS ad-hoc 签名（免费，无需 Apple Developer 账号）
          # 用户首次打开需右键>打开 或 系统设置>隐私与安全性中允许
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MangaViewer __VERSION__"
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: pnpm tauri
