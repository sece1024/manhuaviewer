# git-cliff ~ 配置文件（MangaViewer）
# https://git-cliff.org/docs/configuration
#
# 本地重新生成: pnpm changelog  (= git-cliff -o CHANGELOG.md)
# CI: .github/workflows/release.yml 用 `git-cliff --latest --strip header` 生成 Release 正文

[changelog]
# 生成的文件头：标明自动生成，禁止手工编辑
header = """# Changelog\n
所有值得注意的变更均按 [Conventional Commits](https://www.conventionalcommits.org/) 记录。\n
本文件由 [git-cliff](https://git-cliff.org) 自动生成（`pnpm changelog`），请勿手工编辑。\n
<!-- git-cliff: end of header -->\n
"""
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/releases/tag/v{{ version | trim_start_matches(pat="v") }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## 未发布
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}

{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Replace the placeholder <REPO> with the repository URL.
    { pattern = '<REPO>', replace = "https://github.com/sece1024/manhuaviewer" },
]

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Replace issue numbers with link templates.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups (顺序即分组顺序; `<!-- N -->` 前缀用于稳定排序).
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 新特性" },
    { message = "^fix", group = "<!-- 1 -->🐛 修复" },
    { message = "^refactor", group = "<!-- 2 -->🚜 重构" },
    { message = "^doc", group = "<!-- 3 -->📚 文档" },
    { message = "^perf", group = "<!-- 4 -->⚡ 性能" },
    { message = "^style", group = "<!-- 5 -->🎨 样式" },
    { message = "^test", group = "<!-- 6 -->🧪 测试" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ 杂项" },
    { message = "^docs\\(changelog\\)", skip = true },
    { body = ".*security", group = "<!-- 8 -->🛡️ 安全" },
    { message = "^revert", group = "<!-- 9 -->◀️ 回滚" },
    { message = ".*", group = "<!-- 10 -->💼 其他" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Only consider tags matching v[0-9].* (本仓库所有发行标签都是 vX.Y.Z)
tag_pattern = "v[0-9].*"
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
